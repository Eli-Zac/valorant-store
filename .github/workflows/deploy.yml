name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_RIOT_KEY: ${{ secrets.RIOT_ENCRYPTION_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: worker
        run: npm ci

      # Finds the "valorant-store" KV namespace in your account (or creates it)
      # and writes its ID into wrangler.toml for this run only.
      - name: Find or create KV namespace
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          find_id() {
            npx wrangler kv namespace list \
              | jq -r '[.[] | select(.title | endswith("valorant-store"))][0].id // empty'
          }
          ID=$(find_id)
          if [ -z "$ID" ]; then
            npx wrangler kv namespace create valorant-store
            ID=$(find_id)
          fi
          test -n "$ID" || { echo "Could not find or create the KV namespace"; exit 1; }
          sed -i "s/REPLACE_WITH_KV_NAMESPACE_ID/$ID/g" wrangler.toml

      # Optional: set a repository variable ALLOWED_DISCORD_USERS (comma-separated Discord
      # usernames or ids) to restrict who can sign in. Leave it unset to allow any Discord user.
      - name: Apply optional allow list
        if: ${{ vars.ALLOWED_DISCORD_USERS != '' }}
        env:
          ALLOWED: ${{ vars.ALLOWED_DISCORD_USERS }}
        run: |
          case "$ALLOWED" in
            *[!A-Za-z0-9_.,]*) echo "ALLOWED_DISCORD_USERS may only contain letters, digits, underscores, dots and commas"; exit 1 ;;
          esac
          printf '\n[vars]\nALLOWED_USERS = "%s"\n' "$ALLOWED" >> worker/wrangler.toml

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          secrets: |
            DISCORD_CLIENT_ID
            DISCORD_CLIENT_SECRET
            DISCORD_PUBLIC_KEY
        env:
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          DISCORD_PUBLIC_KEY: ${{ secrets.DISCORD_PUBLIC_KEY }}

      # Registers the /store slash command (worker/commands.json) with Discord. It uses the app's own
      # client credentials, so no bot token is needed. Registration is global and idempotent.
      - name: Register Discord commands
        env:
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
        run: |
          TOKEN=$(curl -fsS -u "$DISCORD_CLIENT_ID:$DISCORD_CLIENT_SECRET" \
            -d grant_type=client_credentials -d scope=applications.commands.update \
            https://discord.com/api/v10/oauth2/token | jq -r .access_token)
          test -n "$TOKEN" && [ "$TOKEN" != null ] || { echo "Could not get a Discord token"; exit 1; }
          curl -fsS -X PUT \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            --data @worker/commands.json \
            "https://discord.com/api/v10/applications/$DISCORD_CLIENT_ID/commands" > commands-registered.json
          echo "Registered Discord commands (use </name:id> in text to make a clickable command mention):"
          jq -r '.[] | "  \(.name) \(.id)"' commands-registered.json

      # Optional: enables the "stay logged in" option for Riot login. Add a repository secret
      # RIOT_ENCRYPTION_KEY (a long random string, 32+ characters) and keep it stable.
      - name: Set optional Riot encryption key
        if: env.HAS_RIOT_KEY == 'true'
        working-directory: worker
        env:
          RIOT_ENCRYPTION_KEY: ${{ secrets.RIOT_ENCRYPTION_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: printf '%s' "$RIOT_ENCRYPTION_KEY" | npx wrangler secret put RIOT_ENCRYPTION_KEY
