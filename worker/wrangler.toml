name = "valorant-store"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Both bindings point at the same KV namespace. The deploy workflow fills in the ID.
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[[kv_namespaces]]
binding = "STORE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Favicon, touch icon and the link-preview image. Served straight from the edge, never through the Worker.
[assets]
directory = "./public"
